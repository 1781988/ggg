name: ci
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]'
      - name: Ruff advisory check
        continue-on-error: true
        run: ruff check .
      - run: pytest -q
      - name: Compile Python entry points
        run: python -m compileall -q src scripts tests
      - name: Validate shell entry points
        run: |
          bash -n scripts/run_full_experiment.sh
          bash -n scripts/run_submission_experiments.sh
          bash -n scripts/run_all_required_experiments.sh
          bash -n scripts/run_final_targeted_experiments.sh
          bash -n scripts/package_final_experiment_review.sh
          bash -n scripts/download_visrag_model_curl.sh
          bash -n scripts/download_colpali_merged_model_curl.sh
      - name: Validate experiment matrices and configs
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from adacolrag.config import load_config

          expected = {
              'configs/development_matrix.yaml': 13,
              'configs/submission_matrix.yaml': 13,
              'configs/final_targeted_matrix.yaml': 4,
          }
          all_ids = {}
          for matrix_path, expected_count in expected.items():
              matrix = yaml.safe_load(Path(matrix_path).read_text(encoding='utf-8'))
              experiments = matrix['experiments']
              ids = [item['id'] for item in experiments]
              assert len(ids) == expected_count, (matrix_path, ids)
              assert len(ids) == len(set(ids)), (matrix_path, ids)
              all_ids[matrix_path] = set(ids)
              for item in experiments:
                  path = Path(item['config'])
                  assert path.is_file(), path
                  config = load_config(path)
                  assert config['candidate_pool'] > 0
                  assert config['top_k'] > 0
                  assert config['selector']['prefilter_factor'] >= 0
              for comparison in matrix.get('comparisons', []):
                  baseline, candidate = comparison.split(':', 1)
                  assert baseline in ids, comparison
                  assert candidate in ids, comparison

          main_required = {
              'visrag_dense',
              'colpali_full',
              'colpali_mean_top50_full',
              'visrag_top50_full',
              'visrag_top50_fixed_112',
              'visrag_top50_mmr_redundancy',
              'visrag_top50_mmr_layout',
              'visrag_top50_mmr',
              'visrag_top50_mmr_fallback',
              'adacolrag_no_fallback',
              'adacolrag',
          }
          assert main_required.issubset(all_ids['configs/submission_matrix.yaml'])

          final_ids = all_ids['configs/final_targeted_matrix.yaml']
          assert final_ids == {
              'final_redundancy_dense025_no_fallback',
              'final_redundancy_dense025_fallback',
              'final_mmr_dense025_no_fallback',
              'final_mmr_dense025_fallback',
          }
          for experiment_id in final_ids:
              config = load_config(f'configs/{experiment_id}.yaml')
              assert config['mode'] == 'fixed_mmr'
              assert config['fixed_tokens'] == 112
              assert config['selector']['prefilter_factor'] == 4.0
              assert abs(config['fusion']['dense_weight'] - 0.25) < 1e-12

          primary = load_config('configs/adacolrag.yaml')
          assert primary['mode'] == 'fixed_mmr'
          assert primary['fixed_tokens'] == 112
          assert primary['selector']['prefilter_factor'] == 4.0
          PY
      - name: Validate manuscript generated-table markers
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('paper/draft.md').read_text(encoding='utf-8')
          markers = [
              'CROSS_DATASET_RESULTS',
              'CROSS_DATASET_DELTAS',
              'PRIMARY_RESULTS',
              'PRIMARY_SIGNIFICANCE',
              'DEVELOPMENT_RESULTS',
              'DEVELOPMENT_SIGNIFICANCE',
              'REPEATED_TIMING',
              'DEVELOPMENT_TIMING',
          ]
          for marker in markers:
              assert text.count(f'<!-- BEGIN AUTO:{marker} -->') == 1, marker
              assert text.count(f'<!-- END AUTO:{marker} -->') == 1, marker
          assert '<<<<<<<' not in text
          assert '>>>>>>>' not in text
          PY
      - run: adacolrag smoke --output /tmp/smoke.json
      - run: python scripts/compare_results.py --reference-smoke results/smoke_reference.json --candidate-smoke /tmp/smoke.json
