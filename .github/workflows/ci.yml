name: ci
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]'
      - name: Ruff advisory check
        continue-on-error: true
        run: ruff check .
      - run: pytest -q
      - name: Compile Python entry points
        run: python -m compileall -q src scripts tests
      - name: Validate shell entry points
        run: |
          bash -n scripts/run_full_experiment.sh
          bash -n scripts/run_submission_experiments.sh
          bash -n scripts/run_all_required_experiments.sh
          bash -n scripts/run_final_targeted_experiments.sh
          bash -n scripts/run_paper_finalization.sh
          bash -n scripts/package_final_experiment_review.sh
          bash -n scripts/package_paper_finalization_review.sh
          bash -n scripts/download_visrag_model_curl.sh
          bash -n scripts/download_colpali_merged_model_curl.sh
      - name: Load final method configuration
        run: |
          test -s configs/adacolrag.yaml
          python -c "from adacolrag.config import load_config; print(load_config('configs/adacolrag.yaml'))"
      - name: Parse final paper matrix
        run: |
          test -s configs/final_paper_matrix.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          matrix = yaml.safe_load(Path('configs/final_paper_matrix.yaml').read_text(encoding='utf-8'))
          print([item['id'] for item in matrix['experiments']])
          print(matrix.get('comparisons', []))
          PY
      - name: Validate manuscript generated-table markers
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('paper/draft.md').read_text(encoding='utf-8')
          markers = [
              'FINAL_SELECTION',
              'FINAL_MAIN_RESULTS',
              'FINAL_SIGNIFICANCE',
              'FINAL_EFFICIENCY',
              'FINAL_STEADY_TIMING',
          ]
          for marker in markers:
              assert text.count(f'<!-- BEGIN AUTO:{marker} -->') == 1, marker
              assert text.count(f'<!-- END AUTO:{marker} -->') == 1, marker
          assert '<<<<<<<' not in text
          assert '>>>>>>>' not in text
          PY
      - run: adacolrag smoke --config configs/smoke.yaml --output /tmp/smoke.json
      - run: python scripts/compare_results.py --reference-smoke results/smoke_reference.json --candidate-smoke /tmp/smoke.json
