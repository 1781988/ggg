experiments:
  - id: visrag_dense
    config: configs/visrag_dense.yaml
    requires_dense: true
    group: external_baseline
    description: VisRAG-Ret dense-only retrieval over the full corpus
  - id: colpali_full
    config: configs/colpali_full.yaml
    requires_dense: false
    group: exhaustive_baseline
    description: Exhaustive full-token ColPali over every page
  - id: colpali_mean_top50_full
    config: configs/colpali_mean_top50_full.yaml
    requires_dense: false
    group: candidate_control
    description: ColPali mean-vector Top-50 candidate generation followed by full-token ColPali
  - id: visrag_top50_full
    config: configs/visrag_top50_full.yaml
    requires_dense: true
    group: candidate_control
    description: VisRAG Top-50 candidate generation followed by full-token ColPali without score fusion
  - id: fixed_32
    config: configs/fixed_32.yaml
    requires_dense: false
    group: colpali_mean_token_baseline
    description: ColPali mean-vector Top-50 with 32 relevance-selected tokens
  - id: fixed_64
    config: configs/fixed_64.yaml
    requires_dense: false
    group: colpali_mean_token_baseline
    description: ColPali mean-vector Top-50 with 64 relevance-selected tokens
  - id: fixed_128
    config: configs/fixed_128.yaml
    requires_dense: false
    group: colpali_mean_token_baseline
    description: ColPali mean-vector Top-50 with 128 relevance-selected tokens
  - id: adaptive_budget
    config: configs/adaptive_budget.yaml
    requires_dense: false
    group: colpali_mean_ablation
    description: ColPali mean-vector Top-50 with adaptive relevance-only token budgets
  - id: adaptive_mmr
    config: configs/adaptive_mmr.yaml
    requires_dense: false
    group: colpali_mean_ablation
    description: ColPali mean-vector Top-50 with adaptive relevance-diversity-layout selection
  - id: adaptive_fallback
    config: configs/adaptive_fallback.yaml
    requires_dense: false
    group: colpali_mean_ablation
    description: ColPali mean-vector Top-50 adaptive MMR with confidence-triggered recovery
  - id: visrag_top50_fixed_112
    config: configs/visrag_top50_fixed_112.yaml
    requires_dense: true
    group: matched_candidate_control
    description: VisRAG Top-50 with a fixed 112-token budget matched to the observed adaptive mean
  - id: visrag_top50_fixed_128
    config: configs/visrag_top50_fixed_128.yaml
    requires_dense: true
    group: matched_candidate_control
    description: VisRAG Top-50 with a fixed 128-token budget
  - id: visrag_top50_adaptive_budget
    config: configs/visrag_top50_adaptive_budget.yaml
    requires_dense: true
    group: matched_candidate_ablation
    description: VisRAG Top-50 with adaptive relevance-only token budgets
  - id: visrag_top50_adaptive_mmr
    config: configs/visrag_top50_adaptive_mmr.yaml
    requires_dense: true
    group: matched_candidate_ablation
    description: VisRAG Top-50 with adaptive relevance-diversity-layout selection
  - id: visrag_top50_adaptive_fallback
    config: configs/visrag_top50_adaptive_fallback.yaml
    requires_dense: true
    group: matched_candidate_ablation
    description: VisRAG Top-50 adaptive MMR with confidence-triggered full-token recovery and no dense score fusion
  - id: adacolrag
    config: configs/adacolrag.yaml
    requires_dense: true
    group: proposed
    description: Complete AdaColRAG with dense candidate generation, adaptive MMR, dense fusion, and fallback
  - id: adacolrag_ocr
    config: configs/adacolrag_ocr.yaml
    requires_dense: true
    group: extension
    description: AdaColRAG with additional OCR lexical fusion
